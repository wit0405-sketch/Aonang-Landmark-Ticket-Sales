<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Counter Sales | Aonang Landmark</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><div class="brand"><span class="glove">🥊</span><div><b>AONANG LANDMARK</b><small>COUNTER SALES PORTAL</small></div></div><div class="topright"><span id="counterName"></span><button class="btn small ghost" id="logout">Logout</button></div></header>
<main class="wrap"><div id="loginPanel" class="login-card"><h2>Counter Login</h2><form id="loginForm"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="btn primary">Sign in</button><p class="error" id="error"></p></form></div>
<section id="app" hidden><div class="page-head"><div><div class="eyebrow">AUTHORIZED TOUR PARTNER</div><h1>Sell tickets</h1><p class="hint">All counters share the same seat availability for each event date.</p></div><label class="date-filter">Event date<input id="eventDate" type="date"></label></div>
<p class="error" id="saleMsg"></p><div class="sale-layout"><section class="panel"><h2>Select seats</h2><div class="legend"><span>Available</span><span>Selected</span><span>Sold</span></div><div id="seatMap"></div></section><aside class="panel summary"><h2>Sale summary</h2><label>Customer name (optional)<input id="customer" maxlength="120"></label><label>Payment method<select id="payment"><option value="cash">Cash</option><option value="transfer">Bank transfer</option></select></label><div class="selected-list" id="selectedList">No seats selected</div><div class="total-line"><span>Total</span><strong id="total">฿0</strong></div><button class="btn primary full" id="completeSale" disabled>Complete sale & issue ticket</button></aside></div><section class="panel"><h2>My recent sales</h2><div class="table-wrap"><table><thead><tr><th>TIME</th><th>REFERENCE</th><th>EVENT DATE</th><th>SEATS</th><th>PAYMENT</th><th>AMOUNT</th></tr></thead><tbody id="mySales"></tbody></table></div><button class="btn ghost small" id="refreshSales">Refresh</button></section></section></main><script src="/app.js"></script></body></html>
